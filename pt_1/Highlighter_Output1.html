<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Syntax Highlighted Output</title>
<style>
text { font-family: 'Monokai', monospace; font-weight: bold; white-space: pre; }
body { background-color: #272822; padding: 20px; line-height: 1.5; }
.comment { color: gray; font-style: italic; }
.number { color: #8f00ff; }
.keyword { color: #f92672; }
.condition { color: #ff9800; }
.loop { color: #ae81ff; }
.string { color: #e6db74; }
.identifier { color: #ffffff; }
.delimiter { color: #a6e22e; }
.assignement_operator { color: #f8f8f2; }
.operation { color: #66d9ef; }
.logical_operator { color: #fd971f; }
.comparison_operator { color: #66d9ef; }
.builtin { color: burlywood; }
.unknown { color: #ff0000; text-decoration: underline; }
</style>
</head>
<body>
<text class="unknown">@</text><text class="identifier">my_val</text><text class="assignement_operator">=</text><text class="number">10</text><br>
<text class="identifier">x</text><text class="assignement_operator">=</text><text class="number">4</text><br>
<text class="identifier">if</text><text class="identifier">x</text><text class="comparison_operator">==</text><text class="number">5</text><br>
<text class="builtins">print</text><text class="delimiter">(</text><text class="string">Correct</text><text class="delimiter">)</text><br>
<text class="identifier">els</text><text class="delimiter">:</text><br>
<text class="identifier">fro</text><text class="identifier">i</text><text class="keyword">in</text><text class="builtins">range</text><text class="delimiter">(</text><text class="number">5</text><text class="delimiter">)</text><text class="delimiter">:</text><br>
<text class="builtins">print</text><text class="delimiter">(</text><text class="identifier">i</text><text class="delimiter">)</text><br>
<text class="identifier">a</text><text class="assignement_operator">=</text><text class="number">2</text><br>
<text class="identifier">whiel</text><text class="identifier">a</text><text class="comparison_operator">&gt;</text><text class="number">0</text><text class="delimiter">:</text><br>
<text class="identifier">a</text><text class="assignement_operator">-=</text><text class="number">1</text><br>
<text class="builtins">print</text><text class="delimiter">(</text><text class="identifier">a</text><br>

</body>
</html>
