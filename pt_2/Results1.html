<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Syntax Highlighted Output</title>
<style>
pre { font-family: monospace; font-size: 14px; line-height: 1.5; margin: 0; }
body { background-color: #272822; color: #f8f8f2; padding: 20px; }
.comment { color: #75715e; font-style: italic; }
.number { color: #ae81ff; }
.keyword { color: #f92672; font-weight: bold; }
.string { color: #e6db74; }
.identifier { color: #ffffff; }
.delimiter { color: #a6e22e; }
.operator { color: #66d9ef; }
.unknown { color: #ff0000; text-decoration: underline; }
</style>
</head>
<body>
<pre><span class="identifier">a</span><span class="operator">=</span><span class="number">-1</span>
<span class="identifier">b</span><span class="operator">=</span><span class="number">2</span><span class="operator">**</span><span class="number">2</span>
<span class="identifier">c</span><span class="operator">=</span><span class="number">3</span><span class="operator">+</span><span class="identifier">a</span><span class="operator">-</span><span class="identifier">b</span><span class="comment"># = -2</span>
<span class="identifier">a</span><span class="operator">=</span><span class="number">2</span>
<span class="identifier">string</span><span class="operator">=</span><span class="string">"This is a string"</span>
<span class="keyword">print</span><span class="delimiter">(</span><span class="identifier">a</span><span class="delimiter">)</span>
<span class="keyword">print</span><span class="delimiter">(</span><span class="identifier">string</span><span class="delimiter">)</span>
</pre>
</body>
</html>
