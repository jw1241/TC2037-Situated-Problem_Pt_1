<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Syntax Highlighted Output</title>
<style>
pre { font-family: monospace; font-size: 14px; line-height: 1.5; margin: 0; }
body { background-color: #272822; color: #f8f8f2; padding: 20px; }
.comment { color: #75715e; font-style: italic; }
.number { color: #ae81ff; }
.keyword { color: #f92672; font-weight: bold; }
.string { color: #e6db74; }
.identifier { color: #ffffff; }
.delimiter { color: #a6e22e; }
.operator { color: #66d9ef; }
.unknown { color: #ff0000; text-decoration: underline; }
</style>
</head>
<body>
<pre><span class="unknown">@</span><span class="identifier">my_val</span><span class="operator">=</span><span class="number">10</span>
<span class="identifier">x</span><span class="operator">=</span><span class="number">4</span>
<span class="keyword">if</span><span class="identifier">x</span><span class="operator">==</span><span class="number">5</span>
    <span class="keyword">print</span><span class="delimiter">(</span><span class="string">"Correct"</span><span class="delimiter">)</span>
<span class="identifier">els</span><span class="delimiter">:</span>
<span class="identifier">fro</span><span class="identifier">i</span><span class="keyword">in</span><span class="keyword">range</span><span class="delimiter">(</span><span class="number">5</span><span class="delimiter">)</span><span class="delimiter">:</span>
<span class="keyword">print</span><span class="delimiter">(</span><span class="identifier">i</span><span class="delimiter">)</span>
<span class="identifier">a</span><span class="operator">=</span><span class="number">2</span>
<span class="identifier">whiel</span><span class="identifier">a</span><span class="operator">&gt;</span><span class="number">0</span><span class="delimiter">:</span>
    <span class="identifier">a</span><span class="operator">-=</span><span class="number">1</span>
    <span class="keyword">print</span><span class="delimiter">(</span><span class="identifier">a</span>
</pre>
</body>
</html>
